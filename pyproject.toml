[project]
name = "dungeon-generator"
version = "0.1.0"
description = "Write a story, get a playable Minecraft dungeon: vanilla trial-chamber pieces arranged by a deterministic jigsaw solver, dressed by a schema-validated LLM logic layer"
readme = "README.md"
license = "MIT"
authors = [{ name = "N1jada" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "nbtlib>=2.0.4",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[project.urls]
Homepage = "https://github.com/N1jada/dungeon-generator"
Issues = "https://github.com/N1jada/dungeon-generator/issues"

[project.scripts]
dungeon = "dungeon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dungeon"]
